<!DOCTYPE html>
<html>
<head>
    <title>Omelette Recipe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5e6d3;
            margin: 0;
            padding: 70px ;
        }

        .recipe {
            width: 400px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 2px dashed brown;
            border-radius: 10px;
        }

        h1 {
            color: brown;
            text-align: center;
        }

        h2 {
            color: saddlebrown;
        }

        ul {
            color: #5c4033;
        }

        li {
            margin: 10px 0;
        }
    </style>

</head>
<body>

    <div class="recipe">

        <h1>Omelette Recipe</h1>

        <h2>Ingredients</h2>

        <ul>
            <li>2 Eggs</li>
            <li>1 tablespoon Butter</li>
            <li>Salt</li>
            <li>Spices (to taste)</li>
            <li>Cheese or vegetables (optional)</li>
        </ul>

    </div>

</body>
</html>
